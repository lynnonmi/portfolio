<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lynn Kim, portfolio archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --cream: #f3ebdc;
  --cream-2: #e7dcc8;
  --paper: #f9f3e8;
  --pink: #e4bdbe;
  --rose: #b5707c;
  --rose-deep: #8c4b57;
  --blue: #a9b7c4;
  --char: #1f1e20;
  --char-2: #2c2a2d;
  --ink: #272427;
  --mute: #7d7468;
  --script: 'Pinyon Script', 'Snell Roundhand', cursive;
  --serif: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  --gut: clamp(16px, 4vw, 56px);
  --max: 1280px;
  --ease: cubic-bezier(.3, .7, .2, 1);
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .18  0 0 0 0 .12  0 0 0 .1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --cross: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><path d='M0 0L100 100M100 0L0 100' stroke='rgba(31,30,32,.16)' stroke-width='1' vector-effect='non-scaling-stroke' fill='none'/></svg>");
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--char); color: var(--ink);
  font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3, p, dl, dd, ol, ul { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--rose-deep); outline-offset: 3px; }
.band :focus-visible, .foot :focus-visible { outline-color: var(--pink); }
.skip { position: absolute; left: 8px; top: -60px; background: var(--cream); color: var(--ink); padding: 10px 14px; z-index: 100; }
.skip:focus { top: 8px; }
main:focus { outline: none; }

.pending { font-style: italic; color: var(--mute); }
.stamp { display: inline-block; font: 600 9px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; border: 1px solid currentColor; padding: 3px 5px; color: var(--rose-deep); margin-right: 6px; }
.small { font-size: .85rem; color: var(--mute); }
.eyebrow { font: 500 .72rem/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--pink); }
.eyebrow--dark { color: var(--rose-deep); }
.display { font: 400 clamp(2.6rem, 6.5vw, 5.4rem)/.95 var(--serif); letter-spacing: -.01em; }
.display em { font-style: italic; color: var(--rose); }
.display--s { font-size: clamp(2rem, 4vw, 3.2rem); }
.textlink { font: 500 .78rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid currentColor; padding: 12px 0 5px; display: inline-block; align-self: flex-end; white-space: nowrap; }
.textlink:hover { color: var(--rose-deep); }

/* ---------- desk and band ---------- */
.desk { max-width: 1600px; margin: 0 auto; overflow-x: clip; }
.band { position: relative; color: var(--cream); background: var(--char); }
.top { display: flex; justify-content: space-between; align-items: baseline; padding: 22px var(--gut) 0; font: 500 .78rem var(--sans); letter-spacing: .08em; }
.logo { text-decoration: none; font: 500 1.35rem var(--serif); letter-spacing: .02em; }
.top__note { opacity: .7; text-transform: uppercase; letter-spacing: .18em; font-size: .68rem; }

.stage { padding: clamp(40px, 7vw, 88px) var(--gut) clamp(36px, 5vw, 64px); max-width: var(--max); margin: 0 auto; }
.stage__title { font: 400 clamp(3.6rem, 12vw, 10rem)/.88 var(--serif); color: var(--pink); margin: 18px 0 20px; letter-spacing: -.02em; overflow-wrap: anywhere; }
.stage__lede { max-width: 46ch; color: #d7cfc2; font-size: 1.02rem; }

/* home stage: giant name over a stack of paper */
.stage--home { padding-top: clamp(24px, 4vw, 56px); padding-bottom: 0; position: relative; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 540px); gap: clamp(24px, 5vw, 72px); align-items: end; position: relative; z-index: 2; }
.hero-copy { padding-bottom: clamp(40px, 5vw, 64px); display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.hero-role { font: 500 clamp(1.5rem, 3vw, 2.3rem)/1.1 var(--serif); color: var(--cream); margin-top: clamp(20px, 3vw, 44px); max-width: 18ch; }
.hero-sub { font: 500 .72rem/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--pink); }
.hero-intro { color: #d7cfc2; max-width: 40ch; font-size: 1.02rem; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.giant { font: 400 clamp(4.2rem, 13.5vw, 12rem)/.82 var(--serif); color: var(--pink); letter-spacing: -.03em; position: relative; z-index: 3; margin: 0; overflow-wrap: anywhere; }
.stack { position: relative; width: 100%; max-width: 540px; justify-self: end; height: clamp(420px, 44vw, 540px); margin-top: calc(clamp(30px, 5vw, 80px) * -1); }
.paper { position: absolute; inset: 0; background: var(--cream); background-image: var(--grain); box-shadow: 0 1px 0 #fff8 inset, 0 12px 24px #0006; }
.paper--3 { transform: rotate(3deg) translate(14px, 10px); background-color: var(--cream-2); }
.paper--2 { transform: rotate(-2.2deg) translate(-10px, 4px); background-color: #ece3d1; }
.paper--1 { display: flex; flex-direction: column; align-items: center; padding: 8% 8% 6%; }
.paper--1::before, .paper--1::after { content: ''; position: absolute; left: 12px; width: 15px; height: 15px; border-radius: 50%; background: var(--char); box-shadow: inset 0 2px 3px #000a; }
.paper--1::before { top: 18%; } .paper--1::after { top: 72%; }
.paper--1 .polaroid { width: 70%; z-index: 2; }
.typed { color: var(--ink); font: 400 .8rem/1.55 var(--sans); letter-spacing: .02em; margin-top: auto; align-self: flex-start; max-width: 28ch; padding-left: 8%; }

/* ---------- tabs: navigation as folder tabs ---------- */
.tabs { margin-top: 0; position: relative; z-index: 4; }
.tabs__row { display: flex; align-items: flex-end; gap: 6px; padding: 0 calc(var(--gut) + 18px); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs__row::-webkit-scrollbar { display: none; }
.tabs a {
  position: relative; flex: 0 0 auto; text-decoration: none; background: var(--cream-2); color: #9d9486;
  font: 600 .74rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase;
  padding: 18px clamp(16px, 2.6vw, 34px) 14px; border-radius: 16px 16px 0 0; box-shadow: inset 0 -8px 10px -8px #0003;
  transition: color .25s, padding .35s var(--ease);
}
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current='page'] { background: var(--cream); background-image: var(--grain); color: var(--ink); padding-top: 24px; box-shadow: none; }
.tabs a[aria-current='page']::before, .tabs a[aria-current='page']::after { content: ''; position: absolute; bottom: 0; width: 16px; height: 16px; }
.tabs a[aria-current='page']::before { left: -16px; background: radial-gradient(circle at 0 0, transparent 15.5px, var(--cream) 16px); }
.tabs a[aria-current='page']::after { right: -16px; background: radial-gradient(circle at 100% 0, transparent 15.5px, var(--cream) 16px); }

/* ---------- sheet ---------- */
.sheet { background: var(--cream); background-image: var(--grain); padding: clamp(32px, 5vw, 72px) var(--gut) 80px; min-height: 60vh; box-shadow: 0 -10px 24px -14px #0008; position: relative; }
.sheet > * { max-width: var(--max); margin-left: auto; margin-right: auto; }
.block { margin-bottom: clamp(64px, 9vw, 130px); }
.block__head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: clamp(28px, 4vw, 52px); }
.foot { display: flex; justify-content: space-between; padding: 22px var(--gut); font: 500 .72rem var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #b9b0a3; }
.foot a { text-decoration: none; }

/* ---------- media and placeholders ---------- */
.media { width: 100%; height: 100%; object-fit: cover; }
.ph { position: relative; width: 100%; height: 100%; min-height: 100%; display: grid; place-items: center; background-color: var(--pink); background-image: var(--cross); background-size: 100% 100%; overflow: hidden; }
.ph span { background: var(--paper); color: var(--mute); font: 600 .6rem/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; padding: 6px 9px; text-align: center; max-width: 80%; }
.ph--pink { background-color: var(--pink); } .ph--rose { background-color: #cf9aa2; }
.ph--blue { background-color: var(--blue); } .ph--cream { background-color: #e6dac4; }
.ph--char { background-color: #4a474b; }

.clip { position: absolute; width: 22px; height: 70px; color: #9a9ba0; top: -26px; left: 50%; transform: translateX(-50%) rotate(4deg); z-index: 5; filter: drop-shadow(1px 2px 1px #0004); pointer-events: none; }
.clip--rose { color: var(--rose); }

.label { display: inline-block; background: var(--paper); border: 1px solid #0002; padding: 3px 7px; font: 500 .62rem/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); box-shadow: 0 1px 2px #0002; }

.polaroid { position: relative; background: var(--paper); padding: 4.5% 4.5% 0; margin: 0; transform: rotate(var(--tilt, 0deg)); box-shadow: 0 1px 1px #0003, 0 10px 22px -6px #0006; max-width: 380px; }
.polaroid__img { aspect-ratio: 1 / 1.05; background: var(--cream-2); overflow: hidden; }
.polaroid figcaption { padding: 12px 2px 14px; font: 500 .72rem/1.3 var(--sans); color: var(--ink); min-height: 3.2em; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }

/* ---------- cards (project sheets) ---------- */
.scatter { display: grid; grid-template-columns: repeat(12, 1fr); gap: 28px; align-items: start; }
.scatter .card:nth-child(1) { grid-column: 1 / 5; }
.scatter .card:nth-child(2) { grid-column: 5 / 9; margin-top: 80px; margin-left: -16px; z-index: 2; }
.scatter .card:nth-child(3) { grid-column: 9 / 13; margin-top: 10px; margin-left: -16px; }
.card { position: relative; display: block; text-decoration: none; background: var(--paper); background-image: var(--grain); padding: 18px 18px 20px; transform: rotate(var(--tilt, 0deg)); box-shadow: 0 1px 1px #0003, 0 14px 26px -10px #0007; transition: transform .45s var(--ease), box-shadow .45s var(--ease); }
.card:hover, .card:focus-visible { transform: rotate(0deg) translateY(-6px); box-shadow: 0 1px 1px #0003, 0 22px 34px -12px #0008; }
.card .label { position: absolute; top: 28px; left: -8px; z-index: 3; }
.card__img { aspect-ratio: 4 / 3; overflow: hidden; margin-bottom: 14px; background: var(--cream-2); }
.card__title { font: 500 1.6rem/1.05 var(--serif); }
.card__meta { font-size: .82rem; color: var(--mute); margin-top: 6px; }
.card__more { display: inline-block; margin-top: 14px; font: 600 .68rem var(--sans); letter-spacing: .16em; text-transform: uppercase; border-bottom: 1px solid currentColor; padding-bottom: 3px; }

/* ---------- spines (folders seen edge-on) ---------- */
.block--spines .display { margin-bottom: 36px; }
.spines { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); grid-auto-rows: 100%; gap: 0; height: clamp(240px, 28vw, 330px); }
.spine { position: relative; min-height: 0; margin-left: -14px; padding-top: calc(var(--i) * 26px); filter: drop-shadow(-6px 0 8px #0003); }
.spine:first-child { margin-left: 0; }
.spine a { display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 18px 18px 18px 26px; text-decoration: none; background: var(--pink); background-image: var(--grain); border-radius: 22px 22px 0 0; color: var(--ink); transition: transform .45s var(--ease); }
.spine a:hover, .spine a:focus-visible { transform: translateY(-14px); }
.spine--blue a { background-color: var(--blue); } .spine--cream a { background-color: #e9dcc3; }
.spine--rose a { background-color: #cf9aa2; } .spine--char a { background-color: var(--char-2); color: var(--cream); }
.spine__label { writing-mode: vertical-rl; transform: rotate(180deg); font: 400 clamp(1.3rem, 2.4vw, 2rem)/1 var(--serif); font-style: italic; align-self: flex-start; }
.spine__count { background: var(--paper); color: var(--ink); font: 500 .6rem var(--sans); letter-spacing: .14em; text-transform: uppercase; padding: 4px 7px; align-self: flex-start; }

/* ---------- photography strip on home ---------- */
.strip-wrap { display: grid; grid-template-columns: 5fr 7fr; gap: clamp(24px, 4vw, 64px); align-items: center; background: var(--char); background-image: var(--grain); color: var(--cream); padding: clamp(28px, 4vw, 56px); box-shadow: 0 16px 30px -14px #0008; }
.strip-copy { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
.strip-copy .display em { color: var(--pink); }
.strip-copy p { color: #cfc6b8; max-width: 32ch; }
.strip-copy .textlink:hover { color: var(--pink); }
.film { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #0e0d0e; padding: 22px 8px; position: relative; }
.film::before, .film::after { content: ''; position: absolute; left: 0; right: 0; height: 8px; background-image: radial-gradient(circle, var(--cream) 2px, transparent 2.6px); background-size: 16px 8px; opacity: .8; }
.film::before { top: 7px; } .film::after { bottom: 7px; }
.film__frame { position: relative; aspect-ratio: 4 / 5; overflow: hidden; }
.film__frame i { position: absolute; left: 6px; bottom: 4px; font: 500 .6rem var(--sans); color: var(--cream); font-style: normal; letter-spacing: .1em; }

.about-note { display: grid; grid-template-columns: minmax(220px, 4fr) 6fr; gap: clamp(28px, 5vw, 80px); align-items: center; }
.about-note .polaroid { margin: 0 auto; }
.note { background: #c6d0da; background-image: var(--grain); padding: clamp(24px, 3.5vw, 48px); transform: rotate(1deg); box-shadow: 0 12px 24px -10px #0006; display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
.note .display em { color: var(--rose-deep); }

/* ---------- Work: filing cabinet ---------- */
.sheet:has(.cabinet) { padding-top: clamp(24px, 3vw, 40px); }
.cabinet { max-width: var(--max); margin: 0 auto; }
.ftabs { position: relative; z-index: 20; margin-bottom: -1px; }
.ftabs__row { display: flex; gap: 5px; overflow-x: auto; padding: 14px 18px 0; scrollbar-width: none; }
.ftabs__row::-webkit-scrollbar { display: none; }
.ftab { position: relative; flex: 0 0 auto; border: 0; background: var(--pink); background-image: var(--grain); color: var(--ink); font: 600 .72rem/1 var(--sans); letter-spacing: .15em; text-transform: uppercase; padding: 17px clamp(14px, 2.2vw, 28px) 13px; border-radius: 14px 14px 0 0; box-shadow: inset 0 -7px 9px -7px #0004; transition: transform .4s var(--ease), padding .4s var(--ease); min-height: 44px; }
.ftab--blue { background-color: var(--blue); } .ftab--cream { background-color: #e9dcc3; }
.ftab--rose { background-color: #cf9aa2; } .ftab--char { background-color: var(--char-2); color: var(--cream); }
.ftab:hover { transform: translateY(-3px); }
.ftab[aria-selected='true'] { padding-top: 24px; box-shadow: none; transform: none; z-index: 2; }
.ftab--pink { --tab: var(--pink); } .ftab--blue { --tab: var(--blue); } .ftab--cream { --tab: #e9dcc3; }
.ftab--rose { --tab: #cf9aa2; } .ftab--char { --tab: var(--char-2); }
.ftab[aria-selected='true']::before, .ftab[aria-selected='true']::after { content: ''; position: absolute; bottom: 0; width: 14px; height: 14px; }
.ftab[aria-selected='true']::before { left: -14px; background: radial-gradient(circle at 0 0, transparent 13.5px, var(--tab) 14px); }
.ftab[aria-selected='true']::after { right: -14px; background: radial-gradient(circle at 100% 0, transparent 13.5px, var(--tab) 14px); }

.cabinet__stack { display: grid; padding-bottom: 64px; position: relative; }
.folder { grid-area: 1 / 1; --d: 0; --r: 0;
  background: var(--pink); background-image: var(--grain); border-radius: 0 20px 6px 6px; padding: clamp(24px, 4vw, 52px);
  transform: translateY(calc(var(--d) * 13px)) rotate(calc(var(--r) * 1deg)); transform-origin: 50% 100%;
  z-index: calc(10 - var(--d)); box-shadow: 0 -1px 0 #fff5 inset, 0 8px 18px -8px #0006;
  transition: transform .6s var(--ease), box-shadow .6s var(--ease); outline-offset: -6px; }
.folder--blue { background-color: var(--blue); } .folder--cream { background-color: #e9dcc3; }
.folder--rose { background-color: #cf9aa2; } .folder--char { background-color: var(--char-2); color: var(--cream); }
.folder--char .display em { color: var(--pink); }
.folder__inner { transition: opacity .35s ease, visibility 0s linear .35s; opacity: 0; visibility: hidden; position: absolute; inset: auto; left: 0; right: 0; top: 0; pointer-events: none; padding: inherit; }
.folder.is-front .folder__inner { position: relative; opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .5s ease .12s, visibility 0s; padding: 0; }
.folder:not(.is-front) { box-shadow: 0 8px 14px -8px #0007; }
.folder__head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: clamp(28px, 4vw, 48px); border-bottom: 1px solid #0003; padding-bottom: 18px; }
.folder--char .folder__head { border-color: #fff3; }
.folder__head p { font-size: .9rem; }
.count { display: inline-block; margin-left: 8px; font: 600 .62rem var(--sans); letter-spacing: .14em; text-transform: uppercase; background: var(--paper); color: var(--ink); padding: 4px 7px; }
.folder__files { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; align-items: start; }
.folder__files .card:nth-child(3n+2) { margin-top: 44px; }
.folder__files .card { color: var(--ink); }
.hint { text-align: center; font-size: .8rem; color: var(--mute); margin-top: 18px; }

/* ---------- Project detail ---------- */
.crumb { font: 500 .7rem var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 24px; }
.crumb a { text-decoration: none; border-bottom: 1px solid #0003; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); border-bottom: 1px solid #0003; margin-bottom: clamp(40px, 6vw, 80px); }
.facts div { padding: 16px 16px 16px 0; }
.facts dt { font: 600 .62rem var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.facts dd { font: 500 1.25rem/1.2 var(--serif); }
.detail { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(36px, 5vw, 72px) clamp(32px, 6vw, 96px); margin-bottom: clamp(60px, 8vw, 110px); }
.detail__sec { position: relative; padding-top: 6px; }
.detail__sec--wide { grid-column: 1 / -1; }
.num { display: block; font: 500 .72rem var(--sans); letter-spacing: .2em; color: var(--rose-deep); margin-bottom: 10px; }
.detail__sec .display { margin-bottom: 18px; }
.detail__sec > p { max-width: 54ch; font-size: 1.05rem; }
.ticks li { padding: 10px 0 10px 26px; border-bottom: 1px solid #0002; position: relative; }
.ticks li::before { content: ''; position: absolute; left: 0; top: 1.2em; width: 12px; height: 1px; background: var(--rose-deep); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; counter-reset: s; }
.steps li { display: flex; gap: 14px; padding: 18px 22px 18px 0; border-top: 1px solid var(--ink); }
.steps b { font: 400 2.4rem/1 var(--serif); color: var(--rose); }
.steps h3 { font: 600 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
.steps p { font-size: .95rem; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 20px; }
.metric { background: var(--paper); background-image: var(--grain); padding: 24px 22px; box-shadow: 0 10px 18px -10px #0006; transform: rotate(-.6deg); }
.metric:nth-child(2) { transform: rotate(.7deg) translateY(10px); }
.metric__v { display: block; font: 400 clamp(2.4rem, 4vw, 3.6rem)/1 var(--serif); }
.metric__l { display: block; font-size: .82rem; margin-top: 8px; color: var(--mute); }
.metric--ph .metric__v { font-size: 1.5rem; }
.evidence { margin-bottom: 70px; }
.evidence .display { margin-bottom: 30px; }
.evidence__row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; align-items: start; }
.evidence__row .polaroid:nth-child(2) { margin-top: 44px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); }
.pager a { text-decoration: none; padding: 24px 0; font: 500 1.7rem/1.1 var(--serif); display: flex; flex-direction: column; gap: 8px; }
.pager a:last-child { text-align: right; align-items: flex-end; }
.pager span { font: 600 .64rem var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.pager a:hover { color: var(--rose-deep); }

/* ---------- Photography ---------- */
.spread { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; align-items: start; }
.shot { position: relative; display: block; width: 100%; border: 0; padding: 0; background: var(--cream-2); overflow: hidden; box-shadow: 0 14px 26px -12px #0008; transition: transform .5s var(--ease); }
.shot:hover, .shot:focus-visible { transform: scale(1.012); }
.shot--tall { aspect-ratio: 4 / 5; } .shot--wide { aspect-ratio: 3 / 2; } .shot--square { aspect-ratio: 1; }
.shot__no { position: absolute; left: 10px; bottom: 8px; font: 500 .66rem var(--sans); letter-spacing: .14em; background: var(--paper); padding: 3px 6px; }
.cap { font-size: .78rem; margin-top: 10px; max-width: 34ch; }
.spread__item--1 { grid-column: 1 / 7; }
.spread__item--2 { grid-column: 7 / 13; margin-top: 90px; }
.spread__item--3 { grid-column: 2 / 6; margin-top: 40px; position: relative; z-index: 2; }
.spread__item--4 { grid-column: 7 / 12; margin-top: 30px; }
.block--blue { background: #c3cdd7; background-image: var(--grain); padding: clamp(28px, 5vw, 64px); margin-left: calc(var(--gut) * -1); margin-right: calc(var(--gut) * -1); max-width: none !important; }
.block--blue > * { max-width: var(--max); margin-left: auto; margin-right: auto; }

.snaps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; max-width: 900px; }
.snap { position: relative; display: block; border: 0; background: var(--paper); padding: 8px 8px 0; text-align: left; transform: rotate(var(--tilt)); box-shadow: 0 12px 20px -8px #0006; transition: transform .45s var(--ease); }

.snap__cap i { font-style: normal; font-weight: 600; letter-spacing: .12em; }
.sheetfilm { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; background: var(--char); padding: 30px 16px; position: relative; box-shadow: 0 16px 28px -14px #000a; }
.sheetfilm::before, .sheetfilm::after { content: ''; position: absolute; left: 0; right: 0; height: 10px; background-image: radial-gradient(circle, var(--cream) 2.4px, transparent 3px); background-size: 20px 10px; opacity: .8; }
.sheetfilm::before { top: 10px; } .sheetfilm::after { bottom: 10px; }

.cs-frame:hover, .cs-frame:focus-visible { transform: scale(1.02); z-index: 2; }
.cs-frame i { position: absolute; right: 8px; bottom: 6px; font: 500 .66rem var(--sans); font-style: normal; color: var(--cream); letter-spacing: .1em; background: #0008; padding: 1px 5px; }
.viewer { border: 0; padding: 0; background: var(--char); color: var(--cream); width: min(980px, 94vw); max-height: 94vh; }
.viewer::backdrop { background: #0009; }

.vbtn { background: none; border: 1px solid #fff6; color: var(--cream); padding: 10px 16px; font: 600 .7rem var(--sans); letter-spacing: .14em; text-transform: uppercase; min-height: 44px; }
.vbtn:hover { background: var(--cream); color: var(--ink); }
#viewer-cap { text-align: center; flex: 1; }

/* ---------- About ---------- */
.about-grid { display: grid; grid-template-columns: 4fr 6fr; gap: clamp(28px, 6vw, 96px); align-items: center; margin-bottom: clamp(60px, 8vw, 110px); }

.about-grid__text { display: flex; flex-direction: column; gap: 22px; }
.lead { font: 400 clamp(1.3rem, 2.2vw, 1.8rem)/1.35 var(--serif); max-width: 36ch; }
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; align-items: start; }
.col { padding: 30px 28px 36px; background-image: var(--grain); box-shadow: 0 12px 22px -12px #0006; border-radius: 16px 16px 4px 4px; }
.col .display { margin-bottom: 18px; }
.col--blue { background-color: var(--blue); transform: rotate(-.5deg); }
.col--pink { background-color: var(--pink); margin-top: 28px; margin-left: -6px; z-index: 2; position: relative; }
.col--cream { background-color: #e9dcc3; margin-left: -6px; transform: rotate(.5deg); }
.plain li { padding: 10px 0; border-bottom: 1px solid #0002; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; }

.plain li span { font-size: .8rem; color: var(--mute); }

/* ---------- Contact ---------- */
.contact { display: grid; grid-template-columns: 7fr 4fr; gap: clamp(28px, 6vw, 90px); align-items: center; }
.note-pad { position: relative; background: #e8bfc3; background-image: var(--grain); padding: clamp(32px, 5vw, 64px); box-shadow: 0 16px 30px -12px #0007; transform: rotate(-.8deg); }

.contact__list { margin-top: 34px; border-top: 1px solid var(--ink); }
.contact__list > div { display: grid; grid-template-columns: 8rem 1fr; gap: 12px; padding: 18px 0; border-bottom: 1px solid #0003; align-items: baseline; }
.contact__list dt { font: 600 .66rem var(--sans); letter-spacing: .18em; text-transform: uppercase; }
.big-link { font: 400 clamp(1.4rem, 2.6vw, 2rem) var(--serif); text-decoration: none; border-bottom: 1px solid currentColor; overflow-wrap: anywhere; }
.big-link--ph { border: 0; font-size: 1.1rem; }
.btn { display: inline-block; background: var(--char); color: var(--cream); text-decoration: none; padding: 14px 22px; font: 600 .72rem var(--sans); letter-spacing: .14em; text-transform: uppercase; min-height: 44px; }
.btn:hover { background: var(--rose-deep); }
.btn--pink { background: var(--pink); color: var(--char); }
.btn--pink:hover { background: var(--cream); color: var(--char); }
.btn--line { background: transparent; color: var(--cream); border: 1px solid #f3ebdc88; }
.btn--line:hover { background: var(--cream); color: var(--char); }
.btn { display: inline-flex; align-items: center; }
.btn--off { background: transparent; color: var(--mute); border: 1px dashed var(--mute); font-style: italic; text-transform: none; letter-spacing: .02em; font-size: .9rem; }
.contact__side .polaroid { margin: 0 auto; }

/* ---------- details from references 6 and 7 ---------- */
.script-em { font-family: var(--script); font-style: normal; font-weight: 400; color: var(--rose); font-size: 1.18em; letter-spacing: 0; padding-right: .06em; }
.script-mark { position: absolute; z-index: 4; right: -14%; bottom: 14%; font: 400 clamp(3.4rem, 8vw, 6.6rem)/1 var(--script); color: var(--rose); transform: rotate(-9deg); text-shadow: 0 1px 0 #fff8; pointer-events: none; }
.year-mark { position: absolute; z-index: 4; right: -12%; bottom: 8%; font: 500 .8rem var(--sans); letter-spacing: .1em; color: var(--rose-deep); }
.tape { position: absolute; z-index: 5; top: -12px; left: 50%; width: 92px; height: 26px; transform: translateX(-50%) rotate(-3deg); background: #d7c79a99; background-image: var(--grain); box-shadow: 0 1px 2px #0003; }
.rings { position: absolute; left: -34px; top: 0; bottom: 0; width: 22px; display: none; }
.stamp-card { position: relative; background: var(--paper); background-image: var(--grain); padding: 26px 22px; margin: 0 auto 36px; max-width: 320px; text-align: center; display: flex; flex-direction: column; gap: 6px; filter: drop-shadow(0 8px 10px #0004); transform: rotate(1.5deg);
  -webkit-mask: radial-gradient(circle 5px at 50% 0, #0000 96%, #000) top / 14px 100% repeat-x, radial-gradient(circle 5px at 50% 100%, #0000 96%, #000) bottom / 14px 100% repeat-x, radial-gradient(circle 5px at 0 50%, #0000 96%, #000) left / 100% 14px repeat-y, radial-gradient(circle 5px at 100% 50%, #0000 96%, #000) right / 100% 14px repeat-y;
  -webkit-mask-composite: source-in; mask-composite: intersect; }
.stamp-card span { font: 400 2rem/1 var(--script); color: var(--rose-deep); }
.stamp-card b { font: 600 .62rem var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.stamp-card i { font: 400 .7rem/1.4 var(--sans); font-style: normal; color: var(--mute); }
.ftab--cream[aria-selected='true'], .tabs a[aria-current='page'] { text-shadow: 0 1px 0 #fffa; }
@media (min-width: 961px) {
  .about-grid__text { position: relative; padding-left: 22px; }
  .rings { display: block; background: radial-gradient(circle, var(--cream) 5px, #7d7468 5.5px, #7d7468 7px, transparent 7.5px) center 12% / 22px 22px no-repeat, radial-gradient(circle, var(--cream) 5px, #7d7468 5.5px, #7d7468 7px, transparent 7.5px) center 50% / 22px 22px no-repeat, radial-gradient(circle, var(--cream) 5px, #7d7468 5.5px, #7d7468 7px, transparent 7.5px) center 88% / 22px 22px no-repeat; left: -30px; }
}
@media (max-width: 640px) { .script-mark { right: 6%; bottom: 3%; font-size: 2.6rem; } .year-mark { display: none; } .typed { max-width: 17ch; } }


/* ---------- master portfolio additions ---------- */
.works { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; align-items: start; }
.works .card:nth-child(3n+2) { margin-top: 44px; }
.works .card:nth-child(3n) { margin-top: 14px; }
.card__org { font: 600 .68rem/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--rose-deep); margin-top: 6px; }
.card__facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 0; padding-top: 10px; border-top: 1px solid #0002; }
.card__facts dt { font: 600 .58rem var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.card__facts dd { font-size: .8rem; line-height: 1.35; }
.card__summary { font-size: .9rem; margin-top: 12px; }
.card__metric { display: flex; flex-direction: column; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #0004; }
.card__metric b { font: 500 1.9rem/1 var(--serif); color: var(--rose-deep); }
.card__metric span { font-size: .76rem; color: var(--mute); margin-top: 2px; }
.card__img { aspect-ratio: 16 / 10; }

.figs-wrap { background: #c3cdd7; background-image: var(--grain); padding: clamp(24px, 4vw, 56px); box-shadow: 0 14px 26px -12px #0007; transform: rotate(-.3deg); max-width: none !important; }
.figs-wrap .display em { color: var(--rose-deep); }
.figs-wrap .block__head { margin-bottom: 20px; }

.figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 clamp(20px, 3vw, 44px); }
.figs a { display: flex; flex-direction: column; gap: 4px; text-decoration: none; padding: 18px 0 20px; border-top: 1px solid var(--ink); height: 100%; }

.fig__l { font-size: .92rem; line-height: 1.35; max-width: 28ch; }

.figs a:hover .fig__v, .figs a:focus-visible .fig__v { color: var(--rose-deep); }

.mini-photo { display: grid; grid-template-columns: 5fr 6fr; gap: clamp(20px, 4vw, 56px); align-items: center; padding: clamp(20px, 3vw, 36px) 0 0; border-top: 1px solid var(--ink); }
.mini-photo__copy { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.mini-photo__copy p { max-width: 34ch; }
.mini-photo__row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 420px; }
.mini { margin: 0; background: var(--paper); padding: 6px 6px 18px; transform: rotate(var(--tilt)); box-shadow: 0 8px 14px -6px #0006; }
.mini .ph, .mini img { aspect-ratio: 1; height: auto; min-height: 0; }
.mini .ph span { font-size: .5rem; padding: 3px 4px; }
.archive-link { text-align: center; margin-top: 6px; }

/* project detail */
.pull { font: italic 400 clamp(1.9rem, 3.8vw, 3.1rem)/1.1 var(--serif); color: var(--rose-deep); max-width: var(--max); padding-right: 30%; text-wrap: balance; margin: 0 auto clamp(40px, 6vw, 80px); }
.periods span { display: block; }
.psec { display: grid; grid-template-columns: 4fr 8fr; gap: clamp(20px, 5vw, 72px); padding-top: 26px; border-top: 1px solid var(--ink); margin-bottom: clamp(44px, 6vw, 84px); }
.psec__head .display { margin-top: 2px; }
.psec__body { min-width: 0; }
.prose p { font-size: 1.1rem; max-width: 60ch; margin-bottom: .9rem; }
.sub { font: 600 .72rem var(--sans); letter-spacing: .16em; text-transform: uppercase; margin: 30px 0 12px; }
.events { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
.event { background: var(--paper); background-image: var(--grain); padding: 22px 22px 24px; box-shadow: 0 12px 20px -10px #0006; transform: rotate(var(--tilt)); }
.event__date { font: 600 .66rem var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--rose-deep); }
.event h3 { font: 500 1.9rem/1.05 var(--serif); margin: 4px 0; }
.event__role { font-size: .88rem; color: var(--mute); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chips span { border: 1px solid var(--ink); padding: 5px 10px; font-size: .8rem; line-height: 1.3; }
.chips--solid span { background: var(--char); color: var(--cream); border-color: var(--char); }
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; }
.themes dt { font: 500 1.35rem var(--serif); }
.themes dd { font-size: .9rem; color: #4d4740; }
.extra { background: #c6d0da; background-image: var(--grain); padding: 18px 22px; margin-top: 26px; max-width: 54ch; transform: rotate(.4deg); box-shadow: 0 10px 18px -10px #0006; }
.extra h3 { font: 500 1.5rem var(--serif); margin-bottom: 4px; }
.note-line { font-style: italic; margin-top: 16px; max-width: 54ch; }
.notes { margin-top: 16px; display: grid; gap: 8px; }
.notes li { border-left: 2px solid var(--rose); padding-left: 12px; font-size: .92rem; max-width: 60ch; }
.reels { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
.reel { background: var(--paper); padding: 10px 10px 14px; box-shadow: 0 10px 16px -8px #0006; }
.reel:nth-child(odd) { transform: rotate(-1deg); } .reel:nth-child(even) { transform: rotate(1deg) translateY(8px); }
.reel__thumb { aspect-ratio: 9 / 13; overflow: hidden; }
.reel__thumb .ph { height: 100%; }
.reel__views { font: 400 2rem/1 var(--serif); margin-top: 10px; }
.reel__views span { font: 600 .6rem var(--sans); letter-spacing: .14em; text-transform: uppercase; margin-left: 6px; color: var(--mute); }
.reel__rank { font-size: .78rem; margin-top: 2px; }
.reel__todo { font-size: .72rem; margin-top: 8px; }
.evi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 14px; }
.evi { margin: 0; }
.evi__img { aspect-ratio: 4 / 3; overflow: hidden; }
.evi__img .ph span { font-size: .52rem; }
.evi figcaption { font-size: .76rem; line-height: 1.35; margin-top: 6px; }

/* about and photography */
.block--intro { max-width: 760px !important; }
.block--intro .display { margin-bottom: 18px; }
.rules { max-width: 62ch; margin-top: 10px; }
.prose--lead p { font: 400 clamp(1.15rem, 1.9vw, 1.5rem)/1.4 var(--serif); max-width: 40ch; margin-bottom: 1rem; }
.edu__row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--ink); }
.edu__row b { font: 500 1.9rem var(--serif); }
.timeline li { display: grid; grid-template-columns: 240px 1fr; gap: 24px; padding: 20px 0; border-top: 1px solid var(--ink); }
.timeline li:last-child { border-bottom: 1px solid var(--ink); }
.timeline__when span { display: block; font: 600 .72rem/1.6 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--rose-deep); }
.timeline__when .pending { text-transform: none; letter-spacing: 0; font-weight: 400; }
.timeline h3 { font: 500 1.8rem/1.1 var(--serif); }
.timeline h3 a { text-decoration: none; border-bottom: 1px solid transparent; }
.timeline h3 a:hover { border-color: currentColor; color: var(--rose-deep); }
.timeline p { margin-top: 2px; }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.skill { padding: 26px 26px 30px; background-image: var(--grain); box-shadow: 0 12px 22px -12px #0006; border-radius: 16px 16px 4px 4px; }
.skill h3 { font: 500 1.7rem var(--serif); margin-bottom: 8px; }
.skill--blue { background-color: var(--blue); transform: rotate(-.4deg); } .skill--pink { background-color: var(--pink); transform: rotate(.4deg); }
.skill--cream { background-color: #e9dcc3; transform: rotate(.3deg); } .skill--rose { background-color: #cf9aa2; transform: rotate(-.3deg); }
.plain li { justify-content: flex-start; }

/* ---------- lace and ribbon ---------- */
.lace-wrap { position: relative; width: 100%; max-width: 440px; margin: 0 auto; padding: 8% 6%; }
.lace-wrap .polaroid { position: relative; z-index: 2; margin: 0 auto; }
.doily { position: absolute; z-index: 0; width: 118%; left: -9%; top: -4%; height: auto; filter: drop-shadow(0 6px 8px #0003); transform: rotate(8deg); pointer-events: none; }
.ribbon { position: absolute; z-index: 3; width: 74%; height: auto; left: -14%; top: 56%; transform: rotate(-14deg); filter: drop-shadow(0 3px 3px #0004); pointer-events: none; }
.about-note .lace-wrap, .about-grid .lace-wrap, .contact__side .lace-wrap { margin-top: 10px; }
.contact__side .ribbon { left: auto; right: -14%; top: 12%; transform: rotate(18deg); }
@media (max-width: 640px) { .lace-wrap { max-width: 320px; } .ribbon { left: -6%; } .contact__side .ribbon { right: -6%; } }

/* ---------- motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; }
  .card:hover, .ftab:hover, .spine a:hover, .snap:hover { transform: none; }
}

/* ---------- tablet ---------- */
@media (max-width: 960px) {
  .scatter { grid-template-columns: repeat(6, 1fr); }
  .scatter .card:nth-child(1) { grid-column: 1 / 5; }
  .scatter .card:nth-child(2) { grid-column: 3 / 7; margin-left: 0; }
  .scatter .card:nth-child(3) { grid-column: 1 / 5; margin-top: 0; margin-left: 0; }
  .strip-wrap, .about-note, .about-grid, .contact { grid-template-columns: 1fr; }
  .facts { grid-template-columns: repeat(2, 1fr); }
  .detail, .cols { grid-template-columns: 1fr; }
  .col--pink, .col--cream { margin-left: 0; margin-top: 16px; }
  .snaps { grid-template-columns: repeat(3, 1fr); }
  .works, .folder__files { grid-template-columns: repeat(2, 1fr); }
  .works .card, .folder__files .card { margin-top: 0 !important; }
  .figs { grid-template-columns: repeat(2, 1fr); }
  .psec { grid-template-columns: 1fr; gap: 16px; }
  .events, .themes, .skills { grid-template-columns: 1fr; }
  .timeline li { grid-template-columns: 1fr; gap: 4px; }
  .hero-grid, .mini-photo { grid-template-columns: 1fr; }
  .stack { justify-self: center; margin-top: 0; }
}

/* ---------- mobile ---------- */
@media (max-width: 640px) {
  body { font-size: 15px; }
  .top__note { display: none; }
  .stack { width: 92%; height: 440px; }
  .spines { grid-template-columns: 1fr; height: auto; gap: 0; }
  .spine { margin-left: 0; margin-top: -10px; padding-top: 0; }
  .spine:first-child { margin-top: 0; }
  .spine a { flex-direction: row-reverse; align-items: center; padding: 22px 20px; height: 74px; border-radius: 18px 18px 0 0; }
  .spine__label { writing-mode: horizontal-tb; transform: none; font-size: 1.9rem; align-self: center; }
  .spine__count { align-self: center; }
  .scatter, .works, .folder__files { display: flex; flex-direction: column; gap: 34px; }
  .figs { grid-template-columns: 1fr; }
  .scatter .card, .works .card, .folder__files .card { margin: 0 !important; width: 94%; }
  .scatter .card:nth-child(even), .works .card:nth-child(even), .folder__files .card:nth-child(even) { align-self: flex-end; }
  .folder { padding: 22px 16px; }
  .cabinet__stack { padding-bottom: 52px; }
  .film { grid-template-columns: repeat(3, 1fr); }
  .evidence__row { grid-template-columns: 1fr; }
  .evidence__row .polaroid { margin: 0 auto !important; width: 86%; }
  .snaps { grid-template-columns: 1fr 1fr; gap: 18px; }
  .snap:nth-child(even) { margin-top: 20px; }
  .spread { display: flex; flex-direction: column; gap: 36px; }
  .spread__item { margin: 0 !important; }
  .spread__item:nth-child(even) { width: 88%; align-self: flex-end; }
  .sheetfilm { grid-template-columns: repeat(2, 1fr); }
  .contact__list > div { grid-template-columns: 1fr; gap: 4px; }
  .facts { grid-template-columns: 1fr 1fr; }
  .pager a { font-size: 1.25rem; }
  .block--blue { margin-left: calc(var(--gut) * -1); margin-right: calc(var(--gut) * -1); }
}
.timeline, .skills { margin-top: 24px; }

/* ======== revision: text-led layouts, per-project sections, quieter decoration ======== */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.display--xs { font-size: clamp(1.6rem, 2.6vw, 2.2rem); }

/* monogram frame used when no portrait is supplied */
.mono { width: 100%; height: 100%; min-height: 100%; display: grid; place-items: center; background-color: var(--pink); background-image: var(--grain); }
.mono span { font: 400 clamp(3rem, 8vw, 5.5rem)/1 var(--serif); font-style: italic; color: var(--rose-deep); letter-spacing: .02em; }
.mono--blue { background-color: var(--blue); } .mono--rose { background-color: #cf9aa2; } .mono--cream { background-color: #e6dac4; }
.polaroid__img .mono { aspect-ratio: 1 / 1.05; }

/* project cards without images: a coloured folder band instead of an empty frame */
.card__band { display: block; margin: -18px -18px 16px; padding: 9px 18px; font: 600 .64rem/1.2 var(--sans); letter-spacing: .16em; text-transform: uppercase; background: var(--pink); background-image: var(--grain); color: var(--ink); }
.card__band--blue { background-color: var(--blue); } .card__band--cream { background-color: #e9dcc3; } .card__band--rose { background-color: #cf9aa2; } .card__band--char { background-color: var(--char-2); color: var(--cream); }
.card .label { display: none; }
.card__img + .card__band { margin-top: 0; }
.card__title { font-size: 1.9rem; }
.card__facts dd { overflow-wrap: anywhere; }

/* home */
.figs { grid-template-columns: repeat(4, 1fr); }
.index { margin-top: clamp(28px, 4vw, 48px); border-top: 1px solid var(--ink); }
.index li { border-bottom: 1px solid #0003; }
.index a { display: grid; grid-template-columns: 3rem 1.3fr 1.2fr 1.6fr; gap: 16px; align-items: baseline; padding: 14px 4px; text-decoration: none; transition: background .25s; }
.index a:hover, .index a:focus-visible { background: #fff6; }
.index__no { font: 600 .7rem var(--sans); letter-spacing: .14em; color: var(--rose-deep); }
.index__title { font: 500 1.5rem/1.1 var(--serif); }
.index__org, .index__role { font-size: .85rem; color: #5a544c; }
.contact-strip { background: var(--paper); background-image: var(--grain); padding: clamp(24px, 4vw, 48px); box-shadow: 0 12px 22px -12px #0006; transform: rotate(-.4deg); display: grid; gap: 14px; max-width: 880px; }
.contact-strip p { max-width: 56ch; }
.contact-strip__links { display: flex; flex-wrap: wrap; gap: 8px 32px; }
.mini-photo__copy p { max-width: 38ch; }
.block--contact { margin-bottom: 0; }

/* project detail */
.facts { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.psec { margin-bottom: clamp(36px, 5vw, 64px); }
.cmp-wrap { overflow-x: auto; }
.cmp { border-collapse: collapse; width: 100%; min-width: 440px; }
.cmp th, .cmp td { text-align: left; padding: 12px 16px 12px 0; border-bottom: 1px solid #0003; vertical-align: top; }
.cmp thead th { font: 600 .66rem var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--rose-deep); border-bottom: 1px solid var(--ink); }
.cmp tbody th { font: 600 .66rem var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); width: 22%; }
.cmp td { font: 400 1.35rem/1.2 var(--serif); }
.events { grid-template-columns: 1fr 1fr; }
.event { transform: none; box-shadow: 0 1px 0 #0002, 0 10px 18px -12px #0006; }
.dcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; border-top: 1px solid var(--ink); }
.dcols > div { padding: 18px 22px 20px 0; border-bottom: 1px solid #0003; }
.dcols dt { font: 500 1.55rem/1.1 var(--serif); margin-bottom: 6px; }
.dcols dd { font-size: .95rem; max-width: 40ch; }
.periods-list { display: grid; gap: 0; border-top: 1px solid var(--ink); max-width: 460px; }
.periods-list li { display: flex; gap: 18px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid #0003; font: 500 1.35rem var(--serif); }
.periods-list b { font: 600 .66rem var(--sans); letter-spacing: .16em; color: var(--rose-deep); }
.callout { border-left: 3px solid var(--rose); padding: 6px 0 6px 20px; max-width: 62ch; }
.callout > p { font: 400 1.35rem/1.35 var(--serif); }
.callout .ticks { margin-top: 12px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; }
.split__side { padding: 22px 24px 24px; background-image: var(--grain); box-shadow: 0 10px 18px -12px #0006; }
.split__side--me { background-color: var(--pink); }
.split__side--them { background-color: var(--paper); border: 1px dashed #0005; box-shadow: none; }
.split__side h3 { font: 600 .68rem var(--sans); letter-spacing: .16em; text-transform: uppercase; margin-bottom: 8px; }
.split__stat { display: flex; flex-direction: column; margin-bottom: 8px; }
.split__stat b { font: 400 clamp(2.6rem, 5vw, 3.8rem)/1 var(--serif); }
.split__stat span { font-size: .85rem; color: #4d4740; }
.reels { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; border-top: 1px solid var(--ink); }
.reel { padding: 18px 18px 20px 0; border-bottom: 1px solid #0003; display: flex; flex-direction: column; gap: 4px; transform: none !important; background: none; box-shadow: none; }
.reel__views { font: 400 clamp(2.4rem, 4vw, 3.2rem)/1 var(--serif); }
.reel__views i { font: 600 .62rem var(--sans); letter-spacing: .14em; text-transform: uppercase; margin-left: 8px; color: var(--mute); font-style: normal; }
.reel__rank { font-size: .88rem; }
.metric { transform: none; box-shadow: 0 1px 0 #0002, 0 10px 18px -12px #0006; }
.metric:nth-child(2) { transform: none; }
.quiet { border-top: 1px solid var(--ink); padding-top: 18px; margin-bottom: 56px; max-width: 70ch; }
.quiet__h { font: 600 .68rem var(--sans); letter-spacing: .16em; text-transform: uppercase; margin-bottom: 6px; }
.quiet p { font-size: .92rem; color: #5a544c; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.gallery figure { margin: 0; } .gallery img { width: 100%; height: auto; }
.gallery figcaption { font-size: .8rem; margin-top: 6px; }
.links { margin: -24px 0 36px; }

/* about and contact: calmer */
.addl { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 28px; border-top: 1px solid var(--ink); margin-top: 18px; }
.addl li { padding: 14px 0 16px; border-bottom: 1px solid #0003; }
.addl h3 { font: 500 1.35rem var(--serif); }
.addl p { font-size: .9rem; }
.addl .small { margin-top: 2px; }
.rings { display: none !important; }
.contact { grid-template-columns: 1fr; max-width: 820px; }
.note-pad { transform: none; }
.quiet-wide { max-width: 760px !important; }

@media (max-width: 960px) {
  .figs { grid-template-columns: repeat(2, 1fr); }
  .index a { grid-template-columns: 2.4rem 1fr; }
  .index__org, .index__role { grid-column: 2; }
  .split { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .figs { grid-template-columns: 1fr; }
  .events { grid-template-columns: 1fr; }
}
.mini-photo { margin-bottom: clamp(48px, 6vw, 90px); }
.mini-photo:not(:has(.mini-photo__row)) { grid-template-columns: 1fr; }
.mini-photo__copy .textlink { align-self: flex-start; }
.about-note .ribbon { top: 74%; left: -16%; width: 66%; transform: rotate(-10deg); }
.links { max-width: var(--max); margin: -24px auto 36px; }
.quiet { max-width: var(--max); margin: 0 auto 56px; padding-right: 35%; }
.figs-wrap { padding-bottom: clamp(20px, 3vw, 36px); }
.figs a { padding-bottom: 6px; }
.links--flow { margin: 18px auto 0; }
.about-grid .polaroid { max-width: 320px; }
@media (max-width: 640px) { .about-grid .polaroid { max-width: 290px; } .about-grid__photo { display: flex; justify-content: center; } }

/* ======== refinement: first-screen hero, editorial spreads, six project layouts ======== */

/* hero: everything essential on the first screen */
.giant { font-size: clamp(3.4rem, 8.6vw, 8rem); line-height: .86; margin: 0 0 6px; }
.stage--home { padding-top: clamp(20px, 3vw, 40px); padding-bottom: 0; }
.hero-grid { align-items: end; gap: clamp(20px, 4vw, 64px); }
.hero-copy { gap: 12px; padding-bottom: clamp(28px, 3.5vw, 44px); }
.hero-role { margin-top: 2px; font-size: clamp(1.25rem, 2.3vw, 1.9rem); max-width: none; }
.hero-intro { max-width: 52ch; font-size: 1.02rem; line-height: 1.5; color: #e6ded1; }
.hero-figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 640px; margin-top: 6px; }
.hero-figs li { transform: rotate(var(--tilt)); }
.hero-figs a { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 11px 13px 13px; background: var(--paper); background-image: var(--grain); color: var(--ink); text-decoration: none; box-shadow: 0 1px 0 #fff8 inset, 0 10px 18px -8px #000a; transition: transform .35s var(--ease); }
.hero-figs a:hover, .hero-figs a:focus-visible { transform: translateY(-4px); }
.hero-figs b { font: 400 clamp(1.8rem, 3.4vw, 2.7rem)/1 var(--serif); color: var(--rose-deep); }
.hero-figs span { font-size: .74rem; line-height: 1.3; color: #4d4740; }
.hero-asof { font-size: .7rem; color: #b9b0a3; letter-spacing: .04em; margin-top: -4px; }
.hero-actions { margin-top: 4px; }
.hero-featured { font-size: .8rem; color: #d7cfc2; }
.hero-featured a { color: var(--cream); text-underline-offset: 3px; }
.stack--band { margin-top: calc(clamp(20px, 3vw, 48px) * -1); height: clamp(400px, 38vw, 500px); }
.sheet-stack { display: none; }

/* spread at the top of every project */
.spreadtop { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(24px, 5vw, 80px); align-items: center; margin: 44px auto clamp(48px, 7vw, 96px); }
.sp-main { position: relative; padding: clamp(28px, 4vw, 48px) clamp(24px, 4vw, 44px) clamp(24px, 3vw, 36px); background: var(--pink); background-image: var(--grain); box-shadow: 0 1px 0 #fff6 inset, 0 16px 28px -14px #0007; border-radius: 0 14px 4px 4px; }
.spreadtop--blue .sp-main { background-color: var(--blue); } .spreadtop--cream .sp-main { background-color: #e9dcc3; }
.spreadtop--rose .sp-main { background-color: #cf9aa2; } .spreadtop--char .sp-main { background-color: var(--char-2); color: var(--cream); }
.sp-tab { position: absolute; left: 0; top: -30px; padding: 8px 20px 6px; background: inherit; background-image: var(--grain); border-radius: 12px 12px 0 0; font: 600 .66rem var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
.sp-metric { display: flex; flex-direction: column; gap: 6px; }
.sp-metric b { font: 400 clamp(3.4rem, 8vw, 6.4rem)/.95 var(--serif); letter-spacing: -.02em; }
.sp-metric span { font-size: 1rem; max-width: 30ch; line-height: 1.35; }
.sp-role { margin-top: 18px; padding-top: 12px; border-top: 1px solid #0003; font: 600 .7rem/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.sp-side { position: relative; min-height: 280px; display: grid; place-items: center; padding: 20px; }
.sp-side .doily { width: min(400px, 96%); left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(8deg); }
.sp-side .ribbon { width: 46%; left: 2%; top: 64%; transform: rotate(-12deg); }
.sp-slip { position: relative; z-index: 2; margin: 0; max-width: 340px; padding: 30px 26px 26px; background: var(--paper); background-image: var(--grain); box-shadow: 0 12px 22px -10px #0007; transform: rotate(2deg); }
.sp-slip p { font: italic 400 clamp(1.5rem, 2.6vw, 2.1rem)/1.15 var(--serif); color: var(--rose-deep); text-wrap: balance; }
.sp-side .polaroid { position: relative; z-index: 2; max-width: 300px; }
.pull { display: none; }

/* layout sections that need the full width */
.psec:has(.journey, .reelwall, .rundown, .tiers, .meter, .festlog, .gal) { grid-template-columns: 1fr; gap: 20px; }
.psec:has(.gal) .prose { max-width: 62ch; }

/* Solo Party: journey */
.journey { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding-top: 6px; }
.journey::before { content: ''; position: absolute; left: 0; right: 0; top: 30px; border-top: 2px dashed #0004; }
.jstop { position: relative; z-index: 1; padding: 16px 14px 18px; background: var(--paper); background-image: var(--grain); border-top: 8px solid var(--pink); box-shadow: 0 10px 18px -12px #0007; display: flex; flex-direction: column; gap: 6px; }
.jstop--blue { border-top-color: var(--blue); }
.jstop:nth-child(even) { margin-top: 30px; transform: rotate(.6deg); } .jstop:nth-child(odd) { transform: rotate(-.6deg); }
.jstop__when { font: 600 .62rem/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--rose-deep); }
.jstop h3 { font: 500 1.5rem/1.1 var(--serif); }
.jstop p { font-size: .86rem; line-height: 1.45; }
.jstop__stat { margin-top: auto; padding-top: 8px; font: 500 1.15rem/1.15 var(--serif); color: var(--rose-deep); }

/* @lynnonmi: reel wall */
.reelwall { display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr; gap: 18px; align-items: start; }
.rw { display: flex; flex-direction: column; gap: 6px; }
.rw:nth-child(2) { margin-top: 28px; } .rw:nth-child(3) { margin-top: 8px; } .rw:nth-child(4) { margin-top: 40px; }
.rw__frame { position: relative; aspect-ratio: 9 / 16; display: grid; place-items: center; background: var(--pink); background-image: var(--grain); box-shadow: 0 14px 24px -12px #0008; overflow: hidden; transform: rotate(var(--r, 0deg)); }
.rw:nth-child(odd) { --r: -.8deg; } .rw:nth-child(even) { --r: .8deg; }
.rw__frame--blue { background-color: var(--blue); } .rw__frame--rose { background-color: #cf9aa2; } .rw__frame--cream { background-color: #e6dac4; }
.rw__frame--img .media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rw__views { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; font: 400 clamp(2.6rem, 5vw, 4.6rem)/1 var(--serif); }
.rw--0 .rw__views { font-size: clamp(3.2rem, 6.4vw, 5.8rem); }
.rw__views i { font: 600 .62rem var(--sans); letter-spacing: .18em; text-transform: uppercase; font-style: normal; margin-top: 4px; }
.rw__frame--img .rw__views { position: absolute; left: 10px; bottom: 10px; align-items: flex-start; background: var(--paper); color: var(--ink); padding: 6px 10px 8px; font-size: 1.7rem; }
.rw__play { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .6; }
.rw__play::after { content: ''; position: absolute; left: 13px; top: 9px; border-left: 11px solid currentColor; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
.rw__rank { font: 600 .66rem var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--rose-deep); }
.rw__note { font-size: .86rem; line-height: 1.4; }
.rw__note b { display: block; font: 600 .6rem var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }

/* TikTok LIVE: broadcast rundown */
.rundown { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--char-2); background-image: var(--grain); color: var(--cream); padding: clamp(20px, 3vw, 32px); box-shadow: 0 16px 28px -14px #000a; }
.rundown li { padding: 6px 22px 8px 0; border-left: 1px solid #fff3; padding-left: 20px; }
.rundown li:first-child { border-left: 0; padding-left: 0; }
.rundown b { display: block; font: 400 3.4rem/1 var(--serif); color: var(--pink); }
.rundown h3 { font: 600 .74rem var(--sans); letter-spacing: .18em; text-transform: uppercase; margin: 8px 0 6px; }
.rundown p { font-size: .9rem; line-height: 1.45; color: #e2dacd; }

/* Red Bull Korea: festival log */
.festlog { display: grid; grid-template-columns: 2.2fr 1fr; gap: clamp(20px, 4vw, 48px); align-items: center; margin-bottom: 26px; }
.stubs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.stubs li { display: flex; flex-direction: column; align-items: center; padding: 10px 4px 9px; background: var(--paper); background-image: var(--grain); border: 1px solid #0003; border-left: 3px dashed #0005; box-shadow: 0 6px 10px -6px #0006; }
.stubs li:nth-child(odd) { transform: rotate(-1.2deg); } .stubs li:nth-child(even) { transform: rotate(1deg); }
.stubs b { font: 400 1.5rem/1 var(--serif); color: var(--rose-deep); }
.stubs span { font: 600 .5rem var(--sans); letter-spacing: .14em; text-transform: uppercase; margin-top: 3px; }
.festlog__cap { font-size: .95rem; }
.festlog__cap b { display: block; font: 400 clamp(4rem, 8vw, 6.5rem)/.9 var(--serif); color: var(--rose-deep); }

/* Pimadaziwin: growth meter and pipeline */
.meter__bar { height: 34px; background: var(--paper); border: 1px solid var(--ink); padding: 4px; box-shadow: 0 8px 14px -10px #0006; }
.meter__bar span { display: block; height: 100%; width: 100%; background: var(--rose); background-image: var(--grain); transform-origin: left; animation: fill 1s var(--ease) both; }
@keyframes fill { from { transform: scaleX(.02); } to { transform: scaleX(1); } }
.meter__ends { display: flex; justify-content: space-between; gap: 16px; margin: 14px 0 6px; }
.meter__ends div:last-child { text-align: right; }
.meter__ends b { display: block; font: 400 clamp(2.8rem, 6vw, 5rem)/1 var(--serif); }
.meter__ends span { font: 600 .66rem var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.pipeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
.pipeline li { position: relative; padding: 16px 16px 18px; background: var(--pink); background-image: var(--grain); box-shadow: 0 10px 18px -12px #0007; }
.pipeline li:not(:last-child)::after { content: '→'; position: absolute; right: -22px; top: 50%; transform: translateY(-50%); font: 400 1.4rem var(--serif); color: var(--rose-deep); }
.pipeline b { font: 400 1.9rem/1 var(--serif); color: var(--rose-deep); }
.pipeline h3 { font: 600 .74rem var(--sans); letter-spacing: .14em; text-transform: uppercase; margin: 6px 0 4px; }
.pipeline p { font-size: .88rem; }

/* Constant / Refilled: two voices */
.tiers { display: grid; gap: 14px; }
.tier { position: relative; max-width: 700px; margin-left: calc(var(--k) * clamp(16px, 5vw, 72px)); padding: 18px 22px 20px; box-shadow: 0 12px 20px -12px #0007; background-image: var(--grain); }
.tier--me { background-color: var(--pink); }
.tier--them { background-color: var(--paper); border: 1px dashed #0006; box-shadow: none; }
.tier__by { display: inline-block; font: 600 .6rem var(--sans); letter-spacing: .16em; text-transform: uppercase; background: var(--char); color: var(--cream); padding: 3px 8px; }
.tier--them .tier__by { background: transparent; color: var(--rose-deep); border: 1px solid var(--rose-deep); }
.tier h3 { font: 500 1.6rem/1.1 var(--serif); margin: 8px 0 4px; }
.tier p { font-size: .95rem; max-width: 56ch; }
.tier__stat { display: block; margin-top: 8px; font: 400 2.6rem/1 var(--serif); color: var(--rose-deep); }

/* real media galleries, shown only when files exist */
.gal { display: grid; gap: 18px; margin-top: 20px; }
.gal--grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.gal--video { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.gal--posters { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); align-items: start; }
.gal--browser { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.gal--polaroids { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); align-items: start; }
.gal--masonry { display: block; columns: 3 260px; column-gap: 18px; }
.gal--masonry .mf { break-inside: avoid; margin-bottom: 18px; }
.mf { margin: 0; min-width: 0; }
.mf img, .mf video, .mf .media { width: 100%; height: auto; display: block; }
.mf figcaption { font-size: .8rem; line-height: 1.35; margin-top: 8px; }
.gal--posters .mf { background: var(--paper); padding: 8px; box-shadow: 0 12px 20px -10px #0007; }
.gal--posters .mf--0 { transform: rotate(-1.2deg); } .gal--posters .mf--1 { transform: rotate(.8deg) translateY(10px); } .gal--posters .mf--2 { transform: rotate(-.4deg); }
.gal--browser .mf { background: var(--paper); padding: 24px 8px 8px; position: relative; box-shadow: 0 12px 20px -10px #0007; }
.gal--browser .mf::before { content: ''; position: absolute; left: 10px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: #c9bfae; box-shadow: 14px 0 0 #c9bfae, 28px 0 0 #c9bfae; }
.gal--polaroids .mf { background: var(--paper); padding: 9px 9px 14px; box-shadow: 0 12px 20px -10px #0007; }
.gal--polaroids .mf--0 { transform: rotate(-2deg); } .gal--polaroids .mf--1 { transform: rotate(1.6deg); } .gal--polaroids .mf--2 { transform: rotate(-1deg); }
.gal--video .mf { background: var(--char); padding: 8px; box-shadow: 0 12px 22px -10px #000a; color: var(--cream); }
.gal--video video { background: #000; }
.card__img .media { transition: transform .6s var(--ease); }
.card:hover .card__img .media { transform: scale(1.04); }

@media (max-width: 960px) {
  .spreadtop { grid-template-columns: 1fr; }
  .journey { grid-template-columns: 1fr; padding-left: 18px; border-left: 2px dashed #0004; }
  .journey::before { display: none; }
  .jstop:nth-child(even), .jstop:nth-child(odd) { margin-top: 0; transform: none; }
  .reelwall { grid-template-columns: 1fr 1fr; }
  .reelwall .rw:nth-child(n) { margin-top: 0; }
  .rundown { grid-template-columns: 1fr 1fr; row-gap: 24px; }
  .rundown li:nth-child(3) { border-left: 0; padding-left: 0; }
  .festlog { grid-template-columns: 1fr; }
  .pipeline { grid-template-columns: 1fr 1fr; }
  .pipeline li:not(:last-child)::after { display: none; }
}
@media (max-width: 640px) {
  .hero-grid { grid-template-columns: 1fr; }
  .stack--band { display: none; }
  .hero-figs { gap: 8px; }
  .hero-figs a { padding: 9px 9px 11px; }
  .hero-figs b { font-size: 1.7rem; }
  .hero-figs span { font-size: .62rem; }
  .hero-role { font-size: 1.15rem; }

/* Real image when src exists. Without one, a quiet monogram frame, never a crossed placeholder. */
function media({ src, alt, width, height }, tone = 'pink', mono = 'LK') {
  if (src) {
    const size = width && height ? ` width="${width}" height="${height}"` : '';
    return `<img class="media" src="${esc(src)}" alt="${esc(alt || '')}"${size} loading="lazy" decoding="async" data-tone="${tone}">`;
  }
  return `<div class="mono mono--${tone}" role="img" aria-label="Portrait to be added"><span>${esc(mono)}</span></div>`;
}

/* A photograph that fails to load is replaced by the monogram frame. */
document.addEventListener(
  'error',
  (e) => {
    const t = e.target;
    if (t && t.tagName === 'IMG' && t.classList.contains('media')) {
      const d = document.createElement('div');
      d.className = `mono mono--${t.dataset.tone || 'pink'}`;
      d.setAttribute('role', 'img');
      d.setAttribute('aria-label', 'Image unavailable');
      d.innerHTML = '<span>LK</span>';
      t.replaceWith(d);
    }
  },
  true
);

/* Lace doily, drawn once as a scalloped disc with punched rings. */
let doilyN = 0;
function doily(cls = '') {
  const id = `dm${doilyN++}`;
  const c = 100;
  const pt = (r, a) => [c + r * Math.cos(a), c + r * Math.sin(a)];
  const N = 46;
  let edge = '';
  for (let i = 0; i < N; i++) {
    const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
    const [x0, y0] = pt(90, a0), [x1, y1] = pt(90, a1);
    edge += (i ? '' : `M${x0.toFixed(1)} ${y0.toFixed(1)}`) + `A6.6 6.6 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  const ring = (r, n, rad) => Array.from({ length: n }, (_, i) => { const [x, y] = pt(r, (i / n) * Math.PI * 2 + (rad ? 0 : 0)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad}" fill="#000"/>`; }).join('');
  return `<svg class="doily ${cls}" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
    <defs><mask id="${id}"><rect width="200" height="200" fill="#fff"/>${ring(80, 46, 2.6)}${ring(70, 23, 4.2)}${ring(59, 34, 2.4)}${ring(47, 17, 4)}${ring(34, 24, 2.2)}${ring(20, 8, 3.6)}</mask></defs>
    <path d="${edge}Z" fill="#f7f2e8" mask="url(#${id})"/>
    <g fill="none" stroke="#c9bfae" stroke-width=".7" opacity=".8"><circle cx="100" cy="100" r="72"/><circle cx="100" cy="100" r="45"/><circle cx="100" cy="100" r="30"/></g>
  </svg>`;
}

/* Ribbon strip with swallow-tail ends. */
function ribbon(cls = '') {
  return `<svg class="ribbon ${cls}" viewBox="0 0 260 44" aria-hidden="true" focusable="false">
    <path d="M0 0H260L244 22L260 44H0L16 22Z" fill="#8f9fb3"/>
    <path d="M16 6H244M16 38H244" stroke="#f3ebdc" stroke-opacity=".55" stroke-width="1" fill="none"/>
    <path d="M0 0H260L244 22L260 44H0L16 22Z" fill="#1f1e20" fill-opacity=".06"/>
  </svg>`;
}

const label = (text) => `<span class="label">${esc(text)}</span>`;

function polaroid({ img, caption, tone, tilt = 0, clipped = false, lace = false, bow = false }) {
  const fig = `<figure class="polaroid" style="--tilt:${tilt}deg">
    ${clipped ? clip() : ''}
    <div class="polaroid__img">${media(img, tone)}</div>

  </figure>`;
  if (!lace && !bow) return fig;
  return `<div class="lace-wrap">${lace ? doily() : ''}${bow ? ribbon() : ''}${fig}</div>`;
}

      return `<section class="folder folder--${c.tone}" role="tabpanel" id="panel-${c.id}" aria-labelledby="tab-${c.id}" tabindex="0">
        <div class="folder__inner">

            <p>${esc(c.note)} <span class="count">${list.length} ${list.length === 1 ? 'project' : 'projects'}</span></p>
          </header>
          <div class="folder__files">${list.map((p, i) => projectCard(p, i)).join('')}</div>
        </div>
      </section>`;
    })
    .join('');
  const body = `<div class="cabinet" id="cabinet">
    <div class="ftabs" role="tablist" aria-label="Project folders"><div class="ftabs__row">${tabs}</div></div>
    <div class="cabinet__stack">${folders}</div>
  </div>
  <p class="hint">Select a tab, or use the left and right arrow keys, to bring a folder forward.</p>
  <p class="archive-link"><a class="textlink" href="?page=photography">Photography archive</a></p>`;
  return {
    html: shell(plainStage('Work', 'Work', 'Six projects in four folders. Bring one forward to see what is inside.'), body, 'work'),
    after: initCabinet,
  };
}

function initCabinet() {
  const tabs = [...document.querySelectorAll('.ftab')];
  const panels = [...document.querySelectorAll('.folder')];
  const n = tabs.length;
  let active = 0;
  let focusAfter = false;

  function paint() {
    panels.forEach((p, i) => {
      const depth = (i - active + n) % n; // 0 is the front folder
      p.style.setProperty('--d', depth);
      p.classList.toggle('is-front', depth === 0);
      p.toggleAttribute('inert', depth !== 0);
      p.setAttribute('aria-hidden', depth !== 0 ? 'true' : 'false');
    });
    tabs.forEach((t, i) => {
      t.setAttribute('aria-selected', i === active ? 'true' : 'false');
      t.tabIndex = i === active ? 0 : -1;
    });
    tabs[active].scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduceMotion.matches ? 'auto' : 'smooth' });
    if (focusAfter) { tabs[active].focus(); focusAfter = false; }
  }

  /* The URL hash is the single source of truth, so Back and Forward step through folders. */
  function fromHash() {
    const j = categories.findIndex((c) => `#${c.id}` === location.hash);
    active = j >= 0 ? j : 0;
    paint();
  }
  function go(i, focus = false) {
    focusAfter = focus;
    active = (i + n) % n;
    paint();
    const id = categories[active].id;
    if (location.hash !== `#${id}`) location.hash = id;
  }

  tabs.forEach((t, i) => {
    t.addEventListener('click', () => go(i));
    t.addEventListener('keydown', (e) => {
      const k = e.key;
      if (k === 'ArrowRight') { e.preventDefault(); go(i + 1, true); }
      else if (k === 'ArrowLeft') { e.preventDefault(); go(i - 1, true); }
      else if (k === 'Home') { e.preventDefault(); go(0, true); }
      else if (k === 'End') { e.preventDefault(); go(n - 1, true); }
    });
  });
  window.addEventListener('hashchange', fromHash);
  fromHash();
}

function renderSection(s, n) {
  const list = (items) => `<ul class="ticks">${items.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`;
  switch (s.type) {
    case 'prose':
      return `<div class="prose">${s.paragraphs.map((t) => `<p>${esc(t)}</p>`).join('')}</div>`;
    case 'compare':
      return `<div class="cmp-wrap"><table class="cmp"><thead><tr><th scope="col"><span class="sr-only">Detail</span></th>${s.columns.map((c) => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${s.rows
        .map(([k, ...vals]) => `<tr><th scope="row">${esc(k)}</th>${vals.map((v) => `<td>${esc(v)}</td>`).join('')}</tr>`)
        .join('')}</tbody></table></div>${s.notes ? `<ul class="notes">${s.notes.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}`;
    case 'events':
      return `<div class="events">${s.events
        .map((e) => `<article class="event"><p class="event__date">${esc(e.date)}</p><h3>${esc(e.name)}</h3><p class="event__role">${esc(e.role)}</p>${list(e.items)}</article>`)
        .join('')}</div>`;
    case 'columns':
      return `<dl class="dcols dcols--${s.items.length}">${s.items.map((c) => `<div><dt>${esc(c.title)}</dt><dd>${esc(c.text)}</dd></div>`).join('')}</dl>`;
    case 'steps':
      return `<ol class="steps">${s.steps.map((x, i) => `<li><b>${String(i + 1).padStart(2, '0')}</b><div><h3>${esc(x.step)}</h3><p>${esc(x.text)}</p></div></li>`).join('')}</ol>`;
    case 'metrics':
      return `<div class="metrics">${s.items.map((r) => `<div class="metric"><span class="metric__v">${esc(r.value)}</span><span class="metric__l">${esc(r.label)}</span></div>`).join('')}</div>${s.notes ? `<ul class="notes">${s.notes.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}`;
    case 'reels':
      return `<ol class="reels">${s.items
        .map((r) => `<li class="reel"><span class="reel__views">${esc(r.views)}<i>views</i></span><span class="reel__rank">${esc(r.rank)}</span>${r.href ? `<a class="textlink" href="${esc(r.href)}" target="_blank" rel="noopener">Watch the Reel</a>` : ''}</li>`)
        .join('')}</ol>${s.note ? `<p class="note-line">${esc(s.note)}</p>` : ''}`;
    case 'split': {
      const side = (x, cls) => `<div class="split__side ${cls}"><h3>${esc(x.heading)}</h3><p class="split__stat"><b>${esc(x.stat.value)}</b><span>${esc(x.stat.label)}</span></p>${list(x.items)}</div>`;
      return `<div class="split">${side(s.left, 'split__side--me')}${side(s.right, 'split__side--them')}</div>${s.note ? `<p class="note-line">${esc(s.note)}</p>` : ''}`;
    }
    case 'periods':
      return `<ol class="periods-list">${s.periods.map((x, i) => `<li><b>${String(i + 1).padStart(2, '0')}</b>${esc(x)}</li>`).join('')}</ol>${s.note ? `<p class="note-line">${esc(s.note)}</p>` : ''}`;
    case 'list':
      return list(s.items);
    case 'chips':
      return `<p class="chips">${s.items.map((x) => `<span>${esc(x)}</span>`).join('')}</p>`;
    case 'callout':
      return `<aside class="callout"><p>${esc(s.text)}</p>${s.items ? list(s.items) : ''}</aside>`;
    default:

  }
}

const hasMedia = (arr) => Array.isArray(arr) && arr.some((m) => m.src);

function mediaFig(m, tone, cls = '') {
  const cap = m.caption ? `<figcaption>${esc(m.caption)}</figcaption>` : '';
  if (m.type === 'video') {
    return `<figure class="mf mf--video ${cls}"><video controls preload="metadata" playsinline${m.poster ? ` poster="${esc(m.poster)}"` : ''} aria-label="${esc(m.alt || m.caption || 'Video')}"><source src="${esc(m.src)}"><a href="${esc(m.src)}">Open the video</a></video>${cap}</figure>`;
  }
  return `<figure class="mf ${cls}">${media(m, tone)}${cap}</figure>`;
}

/* Renders only the items that have a real file. Returns '' when there are none. */
function gallery(items, tone, variant = 'grid', forcedCaption = '') {
  const list = (items || []).filter((m) => m.src);
  if (!list.length) return '';
  return `<div class="gal gal--${variant}">${list.map((m, i) => mediaFig(forcedCaption ? { ...m, caption: m.caption || forcedCaption } : m, tone, `mf--${i % 3}`)).join('')}</div>`;
}

const para = (arr) => `<div class="prose">${arr.map((t) => `<p>${esc(t)}</p>`).join('')}</div>`;
const findSec = (p, type, title) => p.sections.find((s) => s.type === type && (!title || s.title === title));
const secHtml = (p, type, title) => {
  const s = findSec(p, type, title);
  return s ? renderSection(s) : '';

const overview = (p) => ['Overview', secHtml(p, 'prose', 'Overview')];

/* ---------- the six project layouts ---------- */

const layouts = {
  /* Solo Party: an event planning journey */
  journey(p, c) {
    const journey = `<ol class="journey">${p.journey
      .map((j, i) => `<li class="jstop jstop--${c.tone}" style="--k:${i}"><span class="jstop__when">${esc(j.when)}</span><h3>${esc(j.title)}</h3><p>${esc(j.text)}</p>${j.stat ? `<b class="jstop__stat">${esc(j.stat)}</b>` : ''}</li>`)
      .join('')}</ol>`;
    return [
      overview(p),
      ['The journey', journey],
      ['Two editions compared', secHtml(p, 'compare')],
      ['What I did at each event', secHtml(p, 'events')],
      ['Promotion', para(p.promo) + gallery(p.media.promo, c.tone, 'posters')],
      ['The application system', para(p.system) + gallery(p.media.system, c.tone, 'browser')],
      hasMedia(p.media.photos) ? ['On the day', gallery(p.media.photos, c.tone, 'polaroids')] : null,
      ['Results', secHtml(p, 'metrics', 'Results')],
    ];
  },

  /* @lynnonmi: a video-first wall */
  video(p, c) {
    const rs = findSec(p, 'reels');
    const wall = `<ol class="reelwall">${rs.items
      .map((r, i) => {
        const tones = ['pink', 'blue', 'rose', 'cream'];
        const frame = r.thumb && r.thumb.src
          ? `<div class="rw__frame rw__frame--img">${media(r.thumb, tones[i])}<span class="rw__views">${esc(r.views)}<i>views</i></span></div>`
          : `<div class="rw__frame rw__frame--${tones[i]}"><span class="rw__play" aria-hidden="true"></span><span class="rw__views">${esc(r.views)}<i>views</i></span></div>`;
        return `<li class="rw rw--${i}">${frame}<p class="rw__rank">${esc(r.rank)}</p>${r.concept ? `<p class="rw__note"><b>Concept</b>${esc(r.concept)}</p>` : ''}${r.production ? `<p class="rw__note"><b>Production</b>${esc(r.production)}</p>` : ''}${r.href ? `<a class="textlink" href="${esc(r.href)}" target="_blank" rel="noopener">Watch the Reel</a>` : ''}</li>`;
      })

      ['Content themes', secHtml(p, 'columns')],

  /* TikTok LIVE: a broadcast rundown */
  rundown(p, c) {

/* The editorial spread that opens every project: title paper, metric, and a clipped slip or lead image. */
function spreadTop(p, c) {
  const m = p.spreadStat || p.metric;
  const per = periodText(p);
  const lead = p.lead && p.lead.src
    ? polaroid({ img: p.lead, tone: c.tone, tilt: 2, clipped: true, caption: `<span>${esc(p.title)}</span>` })
    : `<blockquote class="sp-slip">${clip()}<p>${esc(p.heading)}</p></blockquote>`;
  return `<section class="spreadtop spreadtop--${c.tone}" aria-label="Project summary">
    <div class="sp-main">
      <span class="sp-tab">${esc(c.label)}</span>
      <p class="sp-metric"><b>${esc(m.value)}</b><span>${esc(m.label)}</span></p>
      <p class="sp-role">${esc(p.role)}${per ? ` · ${esc(per)}` : ''}</p>
    </div>
    <div class="sp-side">${doily()}${ribbon()}${lead}</div>
  </section>`;
}

function projectPage() {
  const slug = document.body.dataset.slug || new URLSearchParams(location.search).get('slug');
  const p = byOrder.find((x) => x.slug === slug);
  if (!p) return notFound('Project not found', 'This project is not in the archive.');
  const idx = byOrder.indexOf(p);
  const c = firstCat(p);
  document.title = `${p.title}, Lynn Kim`;
  const folders = p.categories.map((id) => cat(id));
  let n = 0;
  const section = ([title, inner]) => {
    if (!inner) return '';
    n += 1;
    const id = `s${n}`;
    return `<section class="psec psec--${p.layout}" aria-labelledby="${id}"><header class="psec__head"><span class="num">${String(n).padStart(2, '0')}</span><h2 id="${id}" class="display display--s">${esc(title)}</h2></header><div class="psec__body">${inner}</div></section>`;
  };

  const facts = [['Organization', esc(p.org)], ['Role', esc(p.role)]];
  if (p.periods) facts.push(['Periods', `<span class="periods">${p.periods.map((x) => `<span>${esc(x)}</span>`).join('')}</span>`]);
  else if (p.period) facts.push(['Period', esc(p.period)]);
  if (p.platform) facts.push(['Platform', esc(p.platform)]);
  if (p.asOf) facts.push(['Figures as of', esc(site.asOf)]);
  if (!p.platform && !p.asOf) facts.push(['Folder', folders.map((f) => esc(f.label)).join(', ')]);

  const links = p.links.length ? `<p class="links">${p.links.map((l) => `<a class="textlink" href="${esc(l.href)}"${l.href.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${esc(l.text)}</a>`).join('')}</p>` : '';
  const missing = p.wanted.filter(Boolean);
  const allMedia = Object.values(p.media).flat().concat(p.lead ? [p.lead] : []);
  const quiet = allMedia.some((m) => m.src)
    ? ''
    : `<aside class="quiet"><h2 class="quiet__h">Supporting materials</h2><p>Not yet added: ${missing.map((w) => esc(w.toLowerCase())).join(', ')}.</p></aside>`;

  const prev = byOrder[(idx - 1 + byOrder.length) % byOrder.length];
  const next = byOrder[(idx + 1) % byOrder.length];

  const stage = `<div class="stage">
    <p class="eyebrow">${folders.map((f) => esc(f.label)).join(' / ')}</p>
    <h1 class="stage__title">${esc(p.title)}</h1>
    <p class="stage__lede">${esc(p.subtitle)}</p>
  </div>`;

  const body = `
  <p class="crumb"><a href="?page=work#${c.id}">Work</a> / <a href="?page=work#${c.id}">${esc(c.label)}</a> / ${esc(p.title)}</p>
  <dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
  ${spreadTop(p, c)}
  ${links}
  ${layouts[p.layout](p, c).filter(Boolean).map(section).join('')}
  ${quiet}
  <nav class="pager" aria-label="Other projects">
    <a href="${projectUrl(prev)}" rel="prev"><span>Previous</span>${esc(prev.title)}</a>
    <a href="${projectUrl(next)}" rel="next"><span>Next</span>${esc(next.title)}</a>
  </nav>`;
  return shell(stage, body, 'work');
}

function notFound(title = 'Page not found', text = 'That page does not exist.') {
  return shell(
    plainStage('404', title, text),
    `<div class="block"><p>Go to <a class="textlink" href="?page=home">the home page</a> or <a class="textlink" href="?page=work">the work archive</a>.</p></div>`,
    ''
  );
}
